id = "io.gizlet.littleprince"
version = "0.3.0"
name = "The Little Prince"
category = "game"
description = "Walk three tiny planets, watch their suns set, and follow a flock of migrating birds to your next stop. A short 3D exploration demo for Gizlet handhelds."
tags = ["exploration", "3d", "solo", "relaxing"]
color = "#374978"
license = "MIT"
runtime = 1
icon = "assets/icon.png"
cover = "store/cover.jpg"
screenshots = [
    "docs/screenshots/b612.png",
    "docs/screenshots/lamp.png",
    "docs/screenshots/desert.png",
    "docs/screenshots/fly.png",
]

[names]
zh-CN = "小王子"

[descriptions]
zh-CN = "徒步走过三颗小星球，看太阳落下，再跟着候鸟飞往下一站。一部为 Gizlet 掌机制作的短篇 3D 探索演示。"

[about]
en = "store/about.en.md"
zh-CN = "store/about.zh-CN.md"

[[controls]]
button = "dpad"
action = "Walk"
actions = { zh-CN = "行走" }

[[controls]]
button = "a"
action = "Jump; talk when someone is near; choose in menus"
actions = { zh-CN = "跳跃；靠近时对话；在菜单中选择" }

[[controls]]
button = "b"
action = "Back in menus"
actions = { zh-CN = "在菜单中返回" }

[[controls]]
button = "x"
action = "Star map"
actions = { zh-CN = "星图" }

[[controls]]
button = "y"
action = "Effects: high, mid, low"
actions = { zh-CN = "切换特效：高、中、低" }

[[controls]]
button = "l"
action = "Turn the camera left"
actions = { zh-CN = "向左转动镜头" }

[[controls]]
button = "r"
action = "Turn the camera right"
actions = { zh-CN = "向右转动镜头" }

[[controls]]
button = "start"
action = "Pause menu: settings, statistics, save"
actions = { zh-CN = "暂停菜单：设置、统计、存档" }

[[controls]]
button = "select"
action = "Statistics"
actions = { zh-CN = "统计" }

[[packages]]
target = "aarch64-unknown-linux-gnu"
tier = "lite"
entry = "bin/littleprince"

[[packages]]
target = "x86_64-pc-windows-msvc"
tier = "full"
entry = "bin/littleprince.exe"
